name: Deploy Renda Fixa Calculator to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add iOS home screen icon metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("index.html")
          s = p.read_text()
          s = re.sub(r"""<link[^>]+rel=["']apple-touch-icon["'][^>]*>""", "", s, flags=re.I)
          s = re.sub(r"""<link[^>]+rel=["']icon["'][^>]*>""", "", s, flags=re.I)
          tags = '<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">' + chr(10) + '<link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png">' + chr(10) + '<meta name="apple-mobile-web-app-title" content="Renda Fixa">'
          if "</head>" not in s:
              raise SystemExit("Não foi encontrado </head> no index.html")
          s = s.replace("</head>", tags + chr(10) + "</head>", 1)
          p.write_text(s)
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
